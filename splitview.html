<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabBox Dual-Pane Split View</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f1115;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-control-bar {
      height: 38px;
      background: #181a20;
      border-bottom: 1px solid #282c34;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      user-select: none;
    }
    .brand-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #60a5fa;
    }
    .brand-tag svg {
      width: 14px;
      height: 14px;
    }
    .split-ratio-presets {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .ratio-btn {
      background: #232730;
      border: 1px solid #333842;
      color: #94a3b8;
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .ratio-btn:hover {
      background: #2d323e;
      color: #fff;
    }
    .ratio-btn.active {
      background: #1a73e8;
      border-color: #1a73e8;
      color: #fff;
    }
    .action-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #232730;
      border: 1px solid #333842;
      color: #cbd5e1;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.12s ease;
    }
    .action-btn:hover {
      background: #2d323e;
      color: #fff;
    }
    .action-btn svg {
      width: 12px;
      height: 12px;
    }

    /* Dual Panes Container */
    .dual-pane-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
      background: #000;
    }
    .pane {
      height: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .pane-left {
      width: 50%;
    }
    .pane-right {
      flex: 1;
    }
    .pane-header {
      height: 32px;
      background: #1e2128;
      border-bottom: 1px solid #282c34;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
    }
    .pane-url-input {
      flex: 1;
      height: 22px;
      background: #121418;
      border: 1px solid #303540;
      border-radius: 4px;
      color: #94a3b8;
      font-size: 11px;
      padding: 0 8px;
      outline: none;
    }
    .pane-url-input:focus {
      border-color: #3b82f6;
      color: #fff;
    }
    .pane-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    /* Draggable Splitter Divider */
    .drag-divider {
      width: 6px;
      background: #181a20;
      cursor: col-resize;
      position: relative;
      z-index: 10;
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .drag-divider:hover, .drag-divider.is-dragging {
      background: #3b82f6;
    }
    .divider-handle {
      width: 2px;
      height: 30px;
      background: #475569;
      border-radius: 1px;
    }
    .drag-divider:hover .divider-handle {
      background: #ffffff;
    }

    /* Dragging Overlay to prevent iframes capturing pointer events */
    .drag-shield {
      position: absolute;
      inset: 0;
      z-index: 50;
      cursor: col-resize;
      display: none;
    }
    .drag-shield.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="top-control-bar">
    <div class="brand-tag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
      <span>TabBox Dual-Pane</span>
    </div>

    <div class="split-ratio-presets">
      <button class="ratio-btn" data-ratio="30">30 / 70</button>
      <button class="ratio-btn active" data-ratio="50">50 / 50</button>
      <button class="ratio-btn" data-ratio="70">70 / 30</button>
    </div>

    <div style="display: flex; gap: 6px;">
      <button id="swap-btn" class="action-btn" title="Swap Left and Right Panes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
        <span>Swap</span>
      </button>
      <button id="tile-windows-btn" class="action-btn" title="Tile as Dual Windows on Screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
        <span>Tile Windows</span>
      </button>
    </div>
  </div>

  <div class="dual-pane-container" id="pane-container">
    <div class="drag-shield" id="drag-shield"></div>

    <!-- Left Pane -->
    <div class="pane pane-left" id="pane-left">
      <div class="pane-header">
        <input type="text" class="pane-url-input" id="url-left" placeholder="https://..." />
      </div>
      <iframe class="pane-frame" id="frame-left" src="about:blank"></iframe>
    </div>

    <!-- Draggable Divider -->
    <div class="drag-divider" id="drag-divider" title="Drag to resize panes">
      <div class="divider-handle"></div>
    </div>

    <!-- Right Pane -->
    <div class="pane pane-right" id="pane-right">
      <div class="pane-header">
        <input type="text" class="pane-url-input" id="url-right" placeholder="https://..." />
      </div>
      <iframe class="pane-frame" id="frame-right" src="about:blank"></iframe>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    let leftUrl = params.get('left') || 'https://en.wikipedia.org';
    let rightUrl = params.get('right') || 'https://news.ycombinator.com';

    const frameLeft = document.getElementById('frame-left');
    const frameRight = document.getElementById('frame-right');
    const inputLeft = document.getElementById('url-left');
    const inputRight = document.getElementById('url-right');

    const paneLeft = document.getElementById('pane-left');
    const container = document.getElementById('pane-container');
    const divider = document.getElementById('drag-divider');
    const shield = document.getElementById('drag-shield');

    function loadUrls() {
      inputLeft.value = leftUrl;
      inputRight.value = rightUrl;
      frameLeft.src = leftUrl;
      frameRight.src = rightUrl;
    }
    loadUrls();

    inputLeft.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        let u = inputLeft.value.trim();
        if (!u.startsWith('http')) u = 'https://' + u;
        leftUrl = u;
        frameLeft.src = u;
      }
    });

    inputRight.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        let u = inputRight.value.trim();
        if (!u.startsWith('http')) u = 'https://' + u;
        rightUrl = u;
        frameRight.src = u;
      }
    });

    // Draggable Divider
    let isDragging = false;

    divider.addEventListener('mousedown', (e) => {
      isDragging = true;
      divider.classList.add('is-dragging');
      shield.classList.add('active');
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const rect = container.getBoundingClientRect();
      const x = e.clientX - rect.left;
      let percent = (x / rect.width) * 100;
      percent = Math.max(15, Math.min(85, percent));
      paneLeft.style.width = percent + '%';
      document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        divider.classList.remove('is-dragging');
        shield.classList.remove('active');
      }
    });

    // Ratio Presets
    document.querySelectorAll('.ratio-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.ratio-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const r = btn.dataset.ratio;
        paneLeft.style.width = r + '%';
      });
    });

    // Swap Panes
    document.getElementById('swap-btn').addEventListener('click', () => {
      const temp = leftUrl;
      leftUrl = rightUrl;
      rightUrl = temp;
      loadUrls();
    });

    // Tile Windows
    document.getElementById('tile-windows-btn').addEventListener('click', async () => {
      if (chrome.windows) {
        const availWidth = window.screen.availWidth || 1920;
        const availHeight = window.screen.availHeight || 1080;
        const halfWidth = Math.floor(availWidth / 2);
        await chrome.windows.create({ url: leftUrl, left: 0, top: 0, width: halfWidth, height: availHeight });
        await chrome.windows.create({ url: rightUrl, left: halfWidth, top: 0, width: halfWidth, height: availHeight });
      }
    });
  </script>
</body>
</html>
