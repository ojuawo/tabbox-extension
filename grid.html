<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabBox — Full Bento Grid Workspace</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121316;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .grid-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(18, 19, 22, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #262932;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
    }
    .brand-badge {
      font-size: 10px;
      font-weight: 700;
      background: rgba(99, 102, 241, 0.18);
      color: #a8c7fa;
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 2px 8px;
      border-radius: 99px;
    }
    .search-box {
      flex: 1;
      max-width: 440px;
      background: #1e2026;
      border: 1px solid #2e3340;
      border-radius: 10px;
      padding: 9px 14px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
    }
    .search-box:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
    }
    .mode-switcher {
      display: flex;
      gap: 6px;
      background: #181a20;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid #262932;
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .mode-btn:hover {
      color: #ffffff;
      background: #23262f;
    }
    .mode-btn.active {
      background: #6366f1;
      color: #ffffff;
    }
    .grid-main {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 28px;
    }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #94a3b8;
      text-transform: uppercase;
      margin: 18px 0 10px 0;
    }
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }
    .bento-card {
      position: relative;
      background: #1e2026;
      border: 1.5px solid #2b2f3a;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
    }
    .bento-card:hover {
      transform: translateY(-2px);
      border-color: #6366f1;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }
    .bento-card.active {
      border-color: #a8c7fa;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.35);
    }
    .bento-thumb {
      height: 110px;
      background: #16181d;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #262932;
      position: relative;
      overflow: hidden;
    }
    .bento-thumb img.shot {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }
    .bento-thumb img.fav {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
    .bento-info {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .bento-info img {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .bento-info span {
      font-size: 12px;
      font-weight: 500;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bento-actions {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.12s ease;
    }
    .bento-card:hover .bento-actions {
      opacity: 1;
    }
    .act-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: rgba(15, 23, 42, 0.82);
      color: #ffffff;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .act-btn:hover {
      background: #6366f1;
    }
    .act-btn.close:hover {
      background: #ef4444;
    }
  </style>
</head>
<body>
  <header class="grid-header">
    <div class="brand">
      <span>TabBox Bento Grid</span>
      <span id="tab-counter" class="brand-badge">0 tabs</span>
    </div>
    <input id="grid-search" type="text" class="search-box" placeholder="Search open tabs by title or URL..." autofocus />
    <div class="mode-switcher">
      <button class="mode-btn" data-mode="inpage-rail">1: In-Page Rail</button>
      <button class="mode-btn" data-mode="docked-window">2: Docked Window</button>
      <button class="mode-btn" data-mode="command-grid">3: Command Modal</button>
      <button class="mode-btn" data-mode="sidepanel">4: Side Panel</button>
    </div>
  </header>

  <main class="grid-main">
    <div id="pinned-wrap" hidden>
      <div class="section-label">📌 Pinned Tabs</div>
      <div id="pinned-bento" class="bento-grid"></div>
    </div>

    <div class="section-label">All Open Tabs</div>
    <div id="main-bento" class="bento-grid"></div>
  </main>

  <script src="grid.js"></script>
</body>
</html>
